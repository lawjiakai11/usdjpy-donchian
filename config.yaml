data:
  file_path: "data/raw/USDJPY.csv" 
  
fx_params:
  pip_cost: 0.5          # 0.5 pips round-turn (spread + commission)
  point: 0.01            # USDJPY pip size (0.01)
  annual_carry: 0.02     # 2% annualized USD/JPY interest rate differential proxy

oos_settings:
  oos_months: 60

optimization:
  lookback_grid: [10, 20, 50, 100, 150, 200]

permutation:
  in_sample_runs: 1000
  walk_forward_runs: 1000
  seed: 11

visualization:
  theme: "light"